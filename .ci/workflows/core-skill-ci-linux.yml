name: Core Skill company CI
'on':
  pull_request: {}
  push:
    branches: [main]
    paths:
      - skills/core/**
      - scripts/maintenance/**
      - tests/maintenance/**
      - .ci/**
  workflow_dispatch: {}
jobs:
  core-tests:
    runs-on: company-linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare owned Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/core-skill-venv"
          echo "$RUNNER_TEMP/core-skill-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Install gateway test dependencies
        working-directory: skills/core/zhuojian-subsystem-builder/assets/admin-runtime/gateway
        run: python -m pip install -r requirements-dev.txt
      - name: Install template and validation dependencies
        working-directory: skills/core/zhuojian-subsystem-builder
        run: python -m pip install -r assets/native-subsystem-template/requirements-dev.txt 'jsonschema==4.25.1' 'playwright==1.60.0'
      - name: Verify browser and JavaScript prerequisites
        working-directory: skills/core/zhuojian-subsystem-builder
        run: |
          node --version
          python -c "import runpy; assert runpy.run_path('tests/test_native_template_responsive.py')['browser_executable'](), 'Real Chrome/Chromium is required'"
      - name: Run original core and maintenance suites
        working-directory: skills/core/zhuojian-subsystem-builder
        run: |
          sudo -n env OWN_TEST_PYTHON="$RUNNER_TEMP/core-skill-venv/bin/python" OWN_TEST_RUN="$GITHUB_RUN_ID" PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 - <<'PY'
          import os, shutil, subprocess
          from pathlib import Path
          run = os.environ['OWN_TEST_RUN']
          assert run.isdigit()
          root = Path('/root') / ('zhuojian-own-ci-core-' + run)
          assert not root.exists() and not root.is_symlink()
          root.mkdir(mode=0o700)
          try:
              python = os.environ['OWN_TEST_PYTHON']
              subprocess.run([python, '-m', 'pytest', '-q', '-ra', '--basetemp', str(root/'core')], check=True)
              subprocess.run([python, '-m', 'pytest', '-q', '-ra', '--basetemp', str(root/'maintenance'),
                  '../../../tests/maintenance/test_alphabet_backup_consistency_maintenance.py',
                  '../../../tests/maintenance/test_alphabet_online_schedule.py',
                  '../../../tests/maintenance/test_alphabet_storage_bootstrap.py'], check=True)
          finally:
              assert root.parent == Path('/root') and not root.is_symlink()
              shutil.rmtree(root)
          PY
      - name: Remove only this task environment
        if: always()
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'core-skill-venv'
          if path.exists():
              assert not path.is_symlink()
              shutil.rmtree(path)
