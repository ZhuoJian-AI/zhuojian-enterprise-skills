# Company CI source. GitHub Actions is disabled; original YAML is compatibility history.
name: Company handoff checks
jobs:
  handoff:
    runs-on: company-linux
    timeout-minutes: 5
    steps:
    - env:
        OWN_CI_FETCH_DEPTH: '1'
      shell: python
      run: |
        import os,subprocess
        subprocess.run(["git","init","."],check=True)
        depth=[] if os.environ["OWN_CI_FETCH_DEPTH"]=="0" else ["--depth",os.environ["OWN_CI_FETCH_DEPTH"]]
        subprocess.run(["git","fetch","--no-tags",*depth,os.environ["OWN_CI_SOURCE_DIR"],os.environ["OWN_CI_SOURCE_SHA"]],check=True)
        subprocess.run(["git","checkout","--detach","FETCH_HEAD"],check=True)
        subprocess.run(["git","remote","add","origin","https://github.com/"+os.environ["GITHUB_REPOSITORY"]+".git"],check=True)
        assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==os.environ["OWN_CI_SOURCE_SHA"]
        print("Exact source already checked out by own CI")
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m unittest discover -s tests -v
'on':
  pull_request:
    paths:
    - catalog.json
    - skills/companies/**
    - tests/test_zhuojian_handoff.py
    - tests/test_jupeng_handoff.py
    - .github/workflows/handoff-ci.yml
    - .ci/**
  push:
    branches:
    - main
    paths:
    - catalog.json
    - skills/companies/**
    - tests/test_zhuojian_handoff.py
    - tests/test_jupeng_handoff.py
    - .github/workflows/handoff-ci.yml
    - .ci/**
env:
  OWN_CI: 'true'
  SAAS_CI_PROFILE: shared
  COA_CI_PROFILE: shared
  RUNNER_ENVIRONMENT: self-hosted
