name: Company handoff checks
on:
  pull_request:
    paths: ['catalog.json', 'skills/companies/**', 'tests/test_zhuojian_handoff.py', 'tests/test_jupeng_handoff.py', '.github/workflows/handoff-ci.yml']
  push:
    branches: [main]
    paths: ['catalog.json', 'skills/companies/**', 'tests/test_zhuojian_handoff.py', 'tests/test_jupeng_handoff.py', '.github/workflows/handoff-ci.yml']
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
