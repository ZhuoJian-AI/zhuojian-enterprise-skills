<style>:root{color-scheme:light}*{box-sizing:border-box}html,body{width:100%;min-width:0;min-height:100%;margin:0;overflow-x:hidden}body{min-height:100vh;min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7fb;color:#172033}body[data-navigation-open="true"]{overflow:hidden}.bar{display:flex;gap:12px;align-items:center;min-width:0;padding:18px max(24px,env(safe-area-inset-right)) 18px max(24px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid #e7e9f2}.bar h1{min-width:0;margin:0;overflow:hidden;font-size:18px;text-overflow:ellipsis;white-space:nowrap}.bar .muted{margin-left:auto;white-space:nowrap}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 65px);min-height:calc(100dvh - 65px)}.module-nav{min-width:0;padding:16px 12px;background:#fff;border-right:1px solid #e7e9f2}.module-nav a{display:flex;align-items:center;min-height:44px;padding:10px 12px;border-radius:8px;color:#5148d8;font-weight:600;text-decoration:none}.module-nav a[aria-current="page"]{background:#eeecff}.nav-scrim,#nav-toggle{display:none}.main{width:min(100%,1440px);min-width:0;margin:0 auto;padding:clamp(16px,3vw,24px);padding-bottom:max(24px,env(safe-area-inset-bottom))}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0;margin-bottom:18px}button{min-height:44px;border:0;border-radius:8px;padding:10px 16px;background:#635bff;color:#fff;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:not-allowed}input[type=file]{flex:1 1 260px;min-width:0;max-width:360px;min-height:44px}select,textarea{width:100%;min-width:0;border:1px solid #cdd2df;border-radius:8px;padding:10px 12px;background:#fff;color:inherit;font:inherit}select{min-height:44px}textarea{min-height:120px;resize:vertical}.card{min-width:0;margin:10px 0;padding:16px;border:1px solid #e4e7ef;border-radius:12px;background:#fff}.card pre{max-width:100%;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#6f7787}.error{color:#b42318;overflow-wrap:anywhere}.section{margin-top:28px}.file-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.file-row strong{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}.link{background:#fff;color:#5148d8;border:1px solid #c9c5ff}.ai-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.ai-grid label{display:grid;gap:6px;min-width:0}.ai-review{display:grid;gap:10px}.table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch}.table-scroll>table{min-width:max-content}[hidden]{display:none!important}html[data-zhuojian-embedded="true"] .bar,html[data-zhuojian-embedded="true"] .module-nav,html[data-zhuojian-embedded="true"] .nav-scrim{display:none!important}html[data-zhuojian-embedded="true"] .shell{display:block;min-height:100vh;min-height:100dvh}@media(max-width:1199px){.shell{grid-template-columns:76px minmax(0,1fr)}.module-nav{padding-inline:8px}.module-nav a{justify-content:center;padding-inline:6px}.module-nav a span{display:none}.main{padding:20px}.bar{padding:14px 20px}}@media(max-width:768px),(max-width:900px) and (max-height:500px){.bar{padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}.bar .muted{display:none}#nav-toggle{display:inline-flex;align-items:center;justify-content:center;flex:0 0 44px;padding:0}.shell{display:block;min-height:calc(100vh - 69px);min-height:calc(100dvh - 69px)}.module-nav{position:fixed;z-index:30;inset:0 auto 0 0;width:min(82vw,300px);padding:max(20px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));transform:translateX(-105%);border-right:1px solid #e7e9f2;box-shadow:12px 0 30px rgba(23,32,51,.16);transition:transform .2s ease}.module-nav[data-open="true"]{transform:translateX(0)}.module-nav a{justify-content:flex-start;padding-inline:12px}.module-nav a span{display:inline}.nav-scrim{position:fixed;z-index:29;inset:0;display:block;width:100%;height:100%;padding:0;border-radius:0;background:rgba(15,23,42,.32)}.main{padding:16px;padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(20px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left))}.actions{align-items:stretch}.actions>button{flex:1 1 120px}.actions>input[type=file]{flex-basis:100%;max-width:none}.file-row{align-items:stretch}.file-row strong{flex-basis:100%}.file-row .link{flex:1 1 100px}.ai-grid{grid-template-columns:1fr}}@media(hover:none){.link{min-width:44px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}</style></head>
<body><div class="bar"><button id="nav-toggle" type="button" aria-label="打开业务导航" aria-expanded="false">☰</button><h1 id="page-title">Alphabet 业务模块</h1><span class="muted">灼见原生模块</span></div><div class="shell"><nav id="module-nav" class="module-nav" aria-label="业务导航" data-open="false"><a href="/" aria-current="page">▣ <span>业务列表</span></a></nav><button id="nav-scrim" type="button" class="nav-scrim" aria-label="关闭业务导航" hidden></button><main class="main"><div class="actions"><button id="refresh">刷新</button></div><div id="status" class="muted">正在读取业务数据…</div><div id="records"></div><section id="platform-ai" class="section" hidden><h2>平台专业 AI</h2><p class="muted">AI 只产生可修改草稿；核对后由你明确确认，才能通过普通业务 Action 写入。</p><div class="card ai-grid"><label>能力<select id="platform-ai-capability"></select></label><label>上传输入<input id="platform-ai-files" type="file" multiple></label><label style="grid-column:1/-1">处理要求<textarea id="platform-ai-instruction" placeholder="说明要识别、比较或抽取的内容"></textarea></label><label style="grid-column:1/-1">文字或 JSON 输入<textarea id="platform-ai-text" placeholder="文字抽取或业务预测可在此输入；图片和语音可留空"></textarea></label><div class="actions" style="grid-column:1/-1"><button id="platform-ai-run" type="button">生成可校正草稿</button></div><div id="platform-ai-status" class="muted" style="grid-column:1/-1">等待发起。</div></div><div id="platform-ai-review" class="card ai-review" hidden><strong>请核对 AI 草稿</strong><div id="platform-ai-evidence" class="muted"></div><textarea id="platform-ai-draft" aria-label="可编辑的 AI 草稿"></textarea><button id="platform-ai-confirm" type="button">我已核对，确认写入业务记录</button></div></section><section class="section"><h2>业务文件</h2><div class="actions"><input id="file" type="file"><button id="upload">上传</button></div><div id="file-status" class="muted">正在读取文件…</div><div id="files"></div></section></main></div>
<script>
const moduleKey='__MODULE_KEY__', pageKey='__MODULE_KEY__.list';
const navigation=document.getElementById('module-nav'),navigationToggle=document.getElementById('nav-toggle'),navigationScrim=document.getElementById('nav-scrim');
function setNavigation(open,{fromHistory=false}={}){navigation.dataset.open=String(open);navigationToggle.setAttribute('aria-expanded',String(open));navigationToggle.setAttribute('aria-label',open?'关闭业务导航':'打开业务导航');navigationScrim.hidden=!open;document.body.dataset.navigationOpen=String(open);if(open){history.pushState({...history.state,__zhuojianMobileNavigation:true},document.title);navigation.querySelector('a')?.focus()}else if(!fromHistory&&history.state?.__zhuojianMobileNavigation)history.back()}
navigationToggle.addEventListener('click',()=>setNavigation(navigation.dataset.open!=='true'));navigationScrim.addEventListener('click',()=>setNavigation(false));window.addEventListener('popstate',()=>{if(navigation.dataset.open==='true')setNavigation(false,{fromHistory:true})});window.addEventListener('keydown',event=>{if(event.key==='Escape'&&navigation.dataset.open==='true')setNavigation(false)});
const deleteAttempts=new Map();
let pageName='业务列表';
let applicationSlug='__APPLICATION_SLUG__', launchNonce='', dataVersion='', refreshInFlight=null,currentRecords=[],platformAiCapabilities=[],pageActionKeys=[],activeAiRequestId='',activeAiActionKey='',currentAiDraft=null;
const refreshResults=new Map(),refreshKeys=new Set(['type','version','application_slug','launch_nonce','module_key','page_key','request_id']),aiResponseKeys=new Set(['type','version','application_slug','launch_nonce','module_key','page_key','action_key','request_id','status','run_id','message','result','error']),bridgeKeyPattern=/^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$/;
function bridgeOrigin(){try{const origin=new URL(document.referrer).origin;return origin.startsWith('https://')?origin:null}catch{return null}}
function sendToBridge(message){const target=bridgeOrigin();if(target&&parent!==window)parent.postMessage(message,target)}
function sendContext(){sendToBridge({type:'zhuojian:context',version:1,enterprise_key:'__COMPANY_SLUG__',application_slug:applicationSlug,launch_nonce:launchNonce,module_key:moduleKey,page_key:pageKey,page_name:pageName,route:location.pathname,entity_type:moduleKey,entity_id:null,filters:{},selection:{},data_version:dataVersion||null})}
function newRequestId(){if(crypto.randomUUID)return crypto.randomUUID();const bytes=crypto.getRandomValues(new Uint8Array(16));return `ui-${Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}`}
function node(tag,className,text){const element=document.createElement(tag);if(className)element.className=className;if(text!==undefined)element.textContent=String(text);return element}
function replaceWithMessage(container,text,className='muted'){container.replaceChildren(node('div',`card ${className}`,text))}
function setStatus(id,text,isError=false){const element=document.getElementById(id);element.textContent=String(text);element.className=isError?'error':'muted'}
function actionBody(operation,params={},expectedVersion=null,confirmation){const body={requestId:newRequestId(),moduleKey,pageKey,operation,expectedVersion,params};if(confirmation)body.confirmation=confirmation;return body}
async function loadBootstrap(){const params=new URLSearchParams({moduleKey,pageKey});const r=await fetch(`/api/ui/bootstrap?${params}`);const body=await r.json();if(!r.ok)throw new Error(body.detail||`HTTP ${r.status}`);pageName=String(body.pageName||'业务列表');applicationSlug=String(body.applicationSlug||'');launchNonce=String(body.launchNonce||'');platformAiCapabilities=Array.isArray(body.platformAiCapabilities)?body.platformAiCapabilities:[];pageActionKeys=Array.isArray(body.actionKeys)?body.actionKeys:[];if(!applicationSlug||!launchNonce)throw new Error('当前模块启动上下文无效');const title=`${body.applicationName||'Alphabet'} · ${body.moduleName||'业务模块'}`;document.title=title;document.getElementById('page-title').textContent=title;setupPlatformAi()}
function render(items){currentRecords=Array.isArray(items)?items:[];setStatus('status',`共 ${currentRecords.length} 条`);const records=document.getElementById('records');records.replaceChildren();if(!currentRecords.length){replaceWithMessage(records,'暂无数据，可让业务 AI 按真实需求补齐页面表单。');return}for(const item of currentRecords){const card=node('div','card');card.append(node('strong','',item.id??''),node('div','muted',`状态 ${item.status??''} · 版本 ${item.version??''}`),node('pre','',JSON.stringify(item,null,2)));records.append(card)}}
async function load(){sendContext();setStatus('status','正在读取业务数据…');try{const body=actionBody('query');const r=await fetch(`/api/ui/actions/${moduleKey}.query`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw new Error(result.detail||`HTTP ${r.status}`);render(result.items||[]);return true}catch(e){setStatus('status',e.message,true);return false}}
function fileParams(action){return new URLSearchParams({moduleKey,pageKey,actionKey:`${moduleKey}.${action}`})}
function downloadUrl(fileId){return `/api/ui/files/${encodeURIComponent(fileId)}?${fileParams('query')}`}
function renderFiles(items){setStatus('file-status',`共 ${items.length} 个文件`);const files=document.getElementById('files');files.replaceChildren();if(!items.length){replaceWithMessage(files,'暂无文件。');return}for(const item of items){const card=node('div','card file-row');const download=node('button','link','下载');const remove=node('button','link','删除');download.type='button';remove.type='button';download.addEventListener('click',()=>location.assign(downloadUrl(String(item.fileId))));remove.addEventListener('click',()=>deleteFile(String(item.fileId),Number(item.version)));card.append(node('strong','',item.filename??''),node('span','muted',`${item.size??0} bytes`),download,remove);files.append(card)}}
async function loadFiles(){setStatus('file-status','正在读取文件…');try{const r=await fetch(`/api/ui/files?${fileParams('query')}`);const body=await r.json();if(!r.ok)throw new Error(body.detail||`HTTP ${r.status}`);renderFiles(body.items||[]);return true}catch(e){setStatus('file-status',e.message,true);return false}}
async function upload(){const input=document.getElementById('file'),button=document.getElementById('upload'),file=input.files[0];if(!file){setStatus('file-status','请先选择文件');return}button.disabled=true;setStatus('file-status','正在上传…');try{const params=fileParams('create');params.set('filename',file.name);const r=await fetch(`/api/ui/files?${params}`,{method:'POST',headers:{'content-type':file.type||'application/octet-stream'},body:file});const body=await r.json();if(!r.ok)throw new Error(body.detail||`HTTP ${r.status}`);input.value='';await loadFiles()}catch(e){setStatus('file-status',e.message,true)}finally{button.disabled=false}}
function setupPlatformAi(){const section=document.getElementById('platform-ai'),select=document.getElementById('platform-ai-capability');select.replaceChildren();if(!platformAiCapabilities.length){section.hidden=true;return}section.hidden=false;for(const capability of platformAiCapabilities){const option=node('option','',capability.name||capability.type);option.value=capability.actionKey;select.append(option)}select.onchange=syncPlatformAiInput;syncPlatformAiInput()}
function syncPlatformAiInput(){const selected=platformAiCapabilities.find(item=>item.actionKey===document.getElementById('platform-ai-capability').value);const input=document.getElementById('platform-ai-files'),kinds=new Set(selected?.inputKinds||[]),accept=[];if(kinds.has('image'))accept.push('.png','.jpg','.jpeg','.webp','.bmp','.tif','.tiff');if(kinds.has('audio'))accept.push('.mp3','.wav','.m4a','.webm','.opus','.ogg');if(kinds.has('text'))accept.push('.txt','.md','.markdown','.csv','.tsv','.json');input.accept=accept.join(',');input.disabled=!accept.length}
async function runPlatformAi(){if(parent===window){setStatus('platform-ai-status','请从灼见 SaaS 打开本模块后使用平台专业 AI',true);return}const selected=platformAiCapabilities.find(item=>item.actionKey===document.getElementById('platform-ai-capability').value);if(!selected)return;const button=document.getElementById('platform-ai-run'),files=Array.from(document.getElementById('platform-ai-files').files||[]),instruction=document.getElementById('platform-ai-instruction').value.trim(),textInput=document.getElementById('platform-ai-text').value.trim(),kinds=new Set(selected.inputKinds||[]),context=kinds.has('json')?{dataVersion:dataVersion||null,records:currentRecords.slice(0,50),...(textInput?{userInput:textInput}:{})}:{};activeAiRequestId=newRequestId();activeAiActionKey=selected.actionKey;currentAiDraft=null;document.getElementById('platform-ai-review').hidden=true;button.disabled=true;setStatus('platform-ai-status','正在安全提交给平台 AI…');sendToBridge({type:'zhuojian:ai-run',version:1,application_slug:applicationSlug,launch_nonce:launchNonce,module_key:moduleKey,page_key:pageKey,action_key:selected.actionKey,request_id:activeAiRequestId,capability:selected.type,instruction,context,text_input:kinds.has('text')?textInput:'',files:files.map(file=>({name:file.name,mime_type:file.type||'application/octet-stream',blob:file}))})}
function handlePlatformAiResponse(message){if(message.request_id!==activeAiRequestId)return;if(message.type==='zhuojian:ai-accepted'){setStatus('platform-ai-status','平台已受理，正在处理…');return}if(message.type==='zhuojian:ai-progress'){setStatus('platform-ai-status',String(message.message||'平台 AI 正在处理…'));return}if(message.type!=='zhuojian:ai-result')return;document.getElementById('platform-ai-run').disabled=false;if(message.status!=='draft_ready'){setStatus('platform-ai-status',String(message.error?.messageZh||'平台 AI 处理失败'),true);return}const result=message.result&&typeof message.result==='object'?message.result:{};currentAiDraft=result.draft&&typeof result.draft==='object'?result.draft:null;if(!currentAiDraft){setStatus('platform-ai-status','平台未返回可校正的结构化草稿',true);return}const confidence=typeof result.confidence==='number'?`${Math.round(result.confidence*100)}%`:'未提供',warnings=Array.isArray(result.warnings)?result.warnings:[];document.getElementById('platform-ai-evidence').textContent=`置信度 ${confidence}${warnings.length?` · 需注意：${warnings.join('；')}`:''}`;document.getElementById('platform-ai-draft').value=JSON.stringify(currentAiDraft,null,2);document.getElementById('platform-ai-review').hidden=false;setStatus('platform-ai-status','AI 草稿已生成，请人工核对和修改')}
async function confirmPlatformAiDraft(){if(!currentAiDraft)return;if(!pageActionKeys.includes(`${moduleKey}.create`)){setStatus('platform-ai-status','当前角色只能查看 AI 草稿，没有新增业务记录权限',true);return}const button=document.getElementById('platform-ai-confirm');button.disabled=true;try{let draft;try{draft=JSON.parse(document.getElementById('platform-ai-draft').value)}catch{throw new Error('AI 草稿不是有效 JSON，请修正后再确认')}const body=actionBody('create',{data:draft});const r=await fetch(`/api/ui/actions/${moduleKey}.create`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw new Error(result.detail||`HTTP ${r.status}`);setStatus('platform-ai-status','已经你确认并通过普通业务 Action 写入');document.getElementById('platform-ai-review').hidden=true;currentAiDraft=null;await load()}catch(e){setStatus('platform-ai-status',e.message,true)}finally{button.disabled=false}}
async function deleteFile(fileId,expectedVersion){if(!deleteAttempts.has(fileId)&&!confirm('确认删除这个文件？'))return;setStatus('file-status','正在删除…');try{let attempt=deleteAttempts.get(fileId);if(!attempt){const params={fileId};const requestId=newRequestId();const request={requestId,moduleKey,pageKey,actionKey:`${moduleKey}.delete`,operation:'delete',expectedVersion,params,confirmed:true,subject:'stored-file'};const issued=await fetch('/api/ui/confirmations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(request)});const confirmation=await issued.json();if(!issued.ok)throw new Error(confirmation.detail||`HTTP ${issued.status}`);attempt={requestId,moduleKey,pageKey,operation:'delete',expectedVersion,params,confirmation};deleteAttempts.set(fileId,attempt)}const r=await fetch(`/api/ui/files/${encodeURIComponent(fileId)}?${fileParams('delete')}`,{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify(attempt)});if(!r.ok){let body={};try{body=await r.json()}catch{}throw new Error(body.detail||`HTTP ${r.status}`)}deleteAttempts.delete(fileId);await loadFiles()}catch(e){setStatus('file-status',e.message,true)}}
function postRefreshResult(request,outcome,targetOrigin){parent.postMessage({type:'zhuojian:refresh-result',version:1,application_slug:applicationSlug,launch_nonce:launchNonce,module_key:moduleKey,page_key:pageKey,request_id:request.request_id,status:outcome.status,...(outcome.dataVersion!==undefined?{data_version:outcome.dataVersion}:{}),...(outcome.error?{error:String(outcome.error).slice(0,1000)}:{})},targetOrigin)}
async function refreshCurrentModule(){if(document.getElementById('file').files.length)return{status:'deferred',error:'当前模块存在未保存编辑，已保留输入，暂不刷新'};const [recordsOk,filesOk]=await Promise.all([load(),loadFiles()]);if(!recordsOk||!filesOk)throw new Error('当前模块数据刷新失败');dataVersion=String(Date.now());sendContext();return{status:'completed',dataVersion}}
window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==bridgeOrigin())return;const response=event.data;if(!response||typeof response!=='object'||Array.isArray(response)||Object.keys(response).some(key=>!aiResponseKeys.has(key)))return;if(!['zhuojian:ai-accepted','zhuojian:ai-progress','zhuojian:ai-result'].includes(response.type)||response.version!==1||response.application_slug!==applicationSlug||response.launch_nonce!==launchNonce||response.module_key!==moduleKey||response.page_key!==pageKey||response.action_key!==activeAiActionKey||response.request_id!==activeAiRequestId||!bridgeKeyPattern.test(String(response.action_key||''))||!bridgeKeyPattern.test(String(response.request_id||'')))return;handlePlatformAiResponse(response)});
window.addEventListener('message',async event=>{if(event.source!==parent||event.origin!==bridgeOrigin())return;const request=event.data;if(!request||typeof request!=='object'||Array.isArray(request)||Object.keys(request).some(key=>!refreshKeys.has(key)))return;if(request.type!=='zhuojian:refresh'||request.version!==1||request.application_slug!==applicationSlug||request.launch_nonce!==launchNonce||request.module_key!==moduleKey||request.page_key!==pageKey||!bridgeKeyPattern.test(String(request.request_id||'')))return;const cached=refreshResults.get(request.request_id);if(cached){postRefreshResult(request,cached,event.origin);return}if(!refreshInFlight)refreshInFlight=refreshCurrentModule().catch(error=>({status:'failed',error:error instanceof Error?error.message:'局部刷新失败'})).finally(()=>{refreshInFlight=null});const outcome=await refreshInFlight;refreshResults.set(request.request_id,outcome);if(refreshResults.size>50)refreshResults.delete(refreshResults.keys().next().value);postRefreshResult(request,outcome,event.origin)});
document.getElementById('refresh').onclick=()=>{load();loadFiles()};document.getElementById('upload').onclick=upload;document.getElementById('platform-ai-run').onclick=runPlatformAi;document.getElementById('platform-ai-confirm').onclick=confirmPlatformAiDraft;window.addEventListener('load',async()=>{try{await loadBootstrap();sendToBridge({type:'zhuojian:ready',version:1,application_slug:applicationSlug,launch_nonce:launchNonce});load();loadFiles()}catch(e){setStatus('status',e.message,true);setStatus('file-status',e.message,true)}});
</script></body></html>
