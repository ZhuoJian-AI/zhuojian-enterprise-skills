services:
  app:
    image: ${ZHUOJIAN_IMAGE_NAME:?}
    build: .
    restart: unless-stopped
    environment:
      ZHUOJIAN_MANIFEST_ACCESS_TOKEN: ${ZHUOJIAN_MANIFEST_ACCESS_TOKEN:?}
      ZHUOJIAN_SSO_EXCHANGE_TOKEN: ${ZHUOJIAN_SSO_EXCHANGE_TOKEN:?}
      ZHUOJIAN_ACTION_SIGNING_SECRET: ${ZHUOJIAN_ACTION_SIGNING_SECRET:?}
      ZHUOJIAN_EVENT_SIGNING_SECRET: ${ZHUOJIAN_EVENT_SIGNING_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ZHUOJIAN_ORGANIZATION_ID: ${ZHUOJIAN_ORGANIZATION_ID:?}
      ZHUOJIAN_PUBLIC_ORIGIN: ${ZHUOJIAN_PUBLIC_ORIGIN:?}
      ZHUOJIAN_SAAS_ORIGINS: ${ZHUOJIAN_SAAS_ORIGINS:-https://ai-platform.staging.zhuojianai.com}
      ZHUOJIAN_SAAS_ORIGIN: ${ZHUOJIAN_SAAS_ORIGIN:?}
      DATABASE_PATH: /data/subsystem.db
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-local}
      FILE_STORAGE_ROOT: /data/files
      FILE_STORAGE_GATEWAY_URL: ${FILE_STORAGE_GATEWAY_URL:-}
      FILE_STORAGE_TOKEN: ${FILE_STORAGE_TOKEN:-}
      FILE_STORAGE_GATEWAY_TIMEOUT_SECONDS: ${FILE_STORAGE_GATEWAY_TIMEOUT_SECONDS:-900}
      FILE_STORAGE_MAX_UPLOAD_BYTES: ${FILE_STORAGE_MAX_UPLOAD_BYTES:-536870912}
      FILE_STORAGE_SPOOL_DIR: ${FILE_STORAGE_SPOOL_DIR:-/data/files/.tmp}
      FILE_STORAGE_STATE_FILE: ${FILE_STORAGE_STATE_FILE:-}
      FILE_STORAGE_UPLOAD_LOCK_FILE: ${FILE_STORAGE_UPLOAD_LOCK_FILE:-}
      FILE_STORAGE_RECOVERY_GRACE_SECONDS: ${FILE_STORAGE_RECOVERY_GRACE_SECONDS:-1800}
      FILE_STORAGE_RECOVERY_IO_TIMEOUT_SECONDS: ${FILE_STORAGE_RECOVERY_IO_TIMEOUT_SECONDS:-5}
      # Temporary compatibility aliases for modules created by older Skill versions.
      STORAGE_GATEWAY_URL: ${STORAGE_GATEWAY_URL:-}
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:-}
    volumes:
      - ${ZHUOJIAN_DATA_DIR:?}:/data
    ports:
      - "127.0.0.1:${ZHUOJIAN_APP_PORT:?}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
