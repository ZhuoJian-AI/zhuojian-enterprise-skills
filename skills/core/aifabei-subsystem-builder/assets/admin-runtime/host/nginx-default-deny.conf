# Managed by zhuojian-runtime-admin/v1; default guard profile=standard-ssh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Standard profile: Nginx owns public 443 and rejects unknown TLS SNI.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
