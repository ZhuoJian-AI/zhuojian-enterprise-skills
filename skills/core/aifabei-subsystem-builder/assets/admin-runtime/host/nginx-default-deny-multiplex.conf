# Managed by zhuojian-runtime-admin/v1; default guard profile=ssh-https-multiplex.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Multiplex profile: sslh owns public 443 and forwards HTTPS to loopback 8443.
server {
    listen 127.0.0.1:8443 ssl default_server;
    listen [::1]:8443 ssl default_server;
    ssl_reject_handshake on;
}
